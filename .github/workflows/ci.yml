name: mirrorgate-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mirrorecma_ref:
        description: Matching MirrorECMA commit SHA for optional evaluator integration
        required: false
        type: string
      mirrors_ref:
        description: Matching Mirrors commit SHA for optional evaluator integration
        required: false
        type: string

permissions:
  contents: read

jobs:
  protocol-and-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.96.0
      - name: Install namespace backend
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          python3 --version
          bwrap --version
      - name: Fetch locked native dependencies
        run: cargo fetch --manifest-path runtimes/rust/Cargo.toml --locked
      - name: Protocol, language workers, and required real isolation
        run: bash scripts/test.sh

  evaluator-integration:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mirrorecma_ref != '' || inputs.mirrors_ref != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate explicit matching revisions
        env:
          ECMA_REF: ${{ inputs.mirrorecma_ref }}
          MIRRORS_REF: ${{ inputs.mirrors_ref }}
        run: |
          [[ "$ECMA_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$MIRRORS_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: MirrorGate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NzSN/MirrorECMA
          ref: ${{ inputs.mirrorecma_ref }}
          path: MirrorECMA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NzSN/Mirrors
          ref: ${{ inputs.mirrors_ref }}
          path: Mirrors
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.22.0
          package_json_file: MirrorECMA/package.json
          run_install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.96.0
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap build-essential libssl-dev pkg-config
          cd MirrorECMA
          pnpm install --frozen-lockfile
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: Mirrors
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Build the matching checker and native worker
        run: |
          cd Mirrors
          lake build mirror model_interface_gen
          cd ../MirrorGate
          cargo fetch --manifest-path runtimes/rust/Cargo.toml --locked
          bash scripts/build.sh
      - name: Private evaluator to isolated public ports
        working-directory: MirrorGate
        env:
          MIRRORECMA_ROOT: ${{ github.workspace }}/MirrorECMA
          MIRRORS_ROOT: ${{ github.workspace }}/Mirrors
        run: node integrations/mirrorecma/smoke.mjs
